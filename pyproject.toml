[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ated-transform"
version = "0.1.0"
description = "Reproducible MultiTes XML to SKOS transformation for ATED"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
    "rdflib>=7.0,<8",
]

[project.scripts]
ated-transform = "ated_transform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ated_transform"]
